<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gateway-Harness Control Center{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border: #334155;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }
        nav {
            width: 250px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        nav h1 {
            font-size: 1.15rem;
            margin: 0 0 20px 8px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.15s ease;
        }
        nav a:hover, nav a.active {
            background-color: #334155;
            color: var(--text-primary);
        }
        main {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .metric-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .metric-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
        }
        .metric-green { color: var(--accent-green); }
        .metric-accent { color: var(--accent); }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            background-color: #1a2234;
            color: var(--text-muted);
            font-weight: 600;
        }
        tr:hover {
            background-color: #243048;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-green { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-yellow { background-color: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-red { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-red { background-color: var(--accent-red); color: white; }
        .btn-green { background-color: var(--accent-green); color: white; }
    </style>
</head>
<body>
    <nav>
        <h1>⚡ Gateway-Harness</h1>
        <a href="/overview" class="{% if active_tab == 'overview' %}active{% endif %}">📊 Overview</a>
        <a href="/showcase" class="{% if active_tab == 'showcase' %}active{% endif %}">🚀 Meta Showcase</a>
        <a href="/proposals" class="{% if active_tab == 'proposals' %}active{% endif %}">💡 Proposals</a>
        <a href="/policies" class="{% if active_tab == 'policies' %}active{% endif %}">🛡️ Policies</a>
        <a href="/clusters" class="{% if active_tab == 'clusters' %}active{% endif %}">🔍 Workload Clusters</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
