[project]
name = "gateway-harness"
version = "0.1.0"
description = "Self-hosted intelligent cost-optimizing LLM proxy appliance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm[proxy]==1.106.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "jsonschema>=4.21.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_harness"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
